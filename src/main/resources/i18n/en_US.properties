# Glowstone Internationalization - English (US)
# Default locale

# Command errors
commands.notFound=Unknown command: %s
commands.noPermission=You don't have permission to use this command
commands.playerOnly=This command can only be used by players

# Version mismatch
version.mismatch=Your version (%s) doesn't match the server version (%s)
version.outdated=Your client is outdated. Please update to version %s
version.newer=Your client is too new. Please update to version %s

# Connection errors
connection.closed=Disconnected: %s
connection.timeout=Timed out
connection.kicked=Kicked from server: %s

# Chat messages
chat.format=<%s> %s
chat.say=%s says: %s

# Server messages
server.starting=Starting Glowstone server...
server.ready=Server is ready!
server.stopping=Stopping server...
server.error=An error occurred: %s

# Player messages
player.join=%s joined the game
player.leave=%s left the game
player.gameModeChanged=%s is now in %s mode

# World messages
world.loadError=Failed to load world: %s
world.unload=Unloading world: %s

# Item messages
item.notFound=Unknown item: %s

# General
error.general=Error: %s
warn.general=Warning: %s
info.general=Info: %s
